<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eee; text-align: center; padding: 20px; }
        .box { width: 350px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; margin-top: 30px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        input[type="text"], input[type="password"] { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .hidden { display: none; }
        .candidate-option { text-align: left; margin: 15px 0; padding-left: 20px; font-size: 18px; }
        .logout-btn { background: #dc3545; margin-top: 20px; }
        .logout-btn:hover { background: #c82333; }
    </style>
</head>
<body>

    <h2>Online Voting System</h2>

    <div id="auth-section">
        <div class="box">
            <h3>Register</h3>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Username" required><br>
                <input type="password" id="reg-password" placeholder="Password" required><br>
                <button type="submit">Register</button>
            </form>
        </div>

        <div class="box">
            <h3>Login</h3>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required><br>
                <input type="password" id="login-password" placeholder="Password" required><br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <div id="vote-section" class="hidden">
        <h2 id="welcome-message">Welcome!</h2>
        <div class="box">
            <h3>Cast Your Vote</h3>
            <form id="voting-form">
                <div id="candidates-container"></div>
                <br>
                <button type="submit">Submit Vote</button>
            </form>
        </div>
    </div>

    <div id="results-section" class="hidden">
        <h2>Election Results</h2>
        <div class="box" id="results-container">
            </div>
        <button class="logout-btn" onclick="logout()">Logout & Home</button>
    </div>

    <script>
        // Initialize App State & Mock Database in LocalStorage
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([]));
        }
        if (!localStorage.getItem('candidates')) {
            const initialCandidates = [
                { id: 1, name: 'Candidate A', votes: 0 },
                { id: 2, name: 'Candidate B', votes: 0 },
                { id: 3, name: 'Candidate C', votes: 0 }
            ];
            localStorage.setItem('candidates', JSON.stringify(initialCandidates));
        }

        let currentUser = null;

        // Routing Helper
        function showSection(sectionId) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('vote-section').classList.add('hidden');
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }

        // --- AUTHENTICATION LOGIC ---
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('reg-username').value.trim();
            const p = document.getElementById('reg-password').value;
            let users = JSON.parse(localStorage.getItem('users'));

            if (users.find(user => user.username === u)) {
                alert('Username already exists!');
                return;
            }

            users.push({ username: u, password: p, hasVoted: false });
            localStorage.setItem('users', JSON.stringify(users));
            alert('Registration successful! Please login.');
            this.reset();
        });

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;
            let users = JSON.parse(localStorage.getItem('users'));

            const user = users.find(user => user.username === u && user.password === p);

            if (user) {
                currentUser = user;
                this.reset();
                if (user.hasVoted) {
                    renderResults();
                    showSection('results-section');
                } else {
                    renderVotePage();
                    showSection('vote-section');
                }
            } else {
                alert('Invalid Login Credentials');
            }
        });

        // --- VOTING LOGIC ---
        function renderVotePage() {
            document.getElementById('welcome-message').innerText = `Welcome, ${currentUser.username}!`;
            const container = document.getElementById('candidates-container');
            container.innerHTML = '';
            
            const candidates = JSON.parse(localStorage.getItem('candidates'));
            candidates.forEach(cand => {
                container.innerHTML += `
                    <div class="candidate-option">
                        <input type="radio" name="candidate" value="${cand.id}" required> ${cand.name}
                    </div>
                `;
            });
        }

        document.getElementById('voting-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!confirm('Are you sure you want to cast this vote?')) return;

            const selectedCandId = parseInt(document.querySelector('input[name="candidate"]:checked').value);
            
            // Increment Candidate Vote Count
            let candidates = JSON.parse(localStorage.getItem('candidates'));
            const candidate = candidates.find(c => c.id === selectedCandId);
            if (candidate) candidate.votes += 1;
            localStorage.setItem('candidates', JSON.stringify(candidates));

            // Update User hasVoted state
            let users = JSON.parse(localStorage.getItem('users'));
            const dbUser = users.find(u => u.username === currentUser.username);
            if (dbUser) dbUser.hasVoted = true;
            localStorage.setItem('users', JSON.stringify(users));
            
            currentUser.hasVoted = true;
            renderResults();
            showSection('results-section');
        });

        // --- RESULTS LOGIC ---
        function renderResults() {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            const candidates = JSON.parse(localStorage.getItem('candidates'));
            
            candidates.forEach(cand => {
                container.innerHTML += `<h3>${cand.name} = ${cand.votes} votes</h3>`;
            });
        }

        function logout() {
            currentUser = null;
            showSection('auth-section');
        }
    </script>
</body>
</html>
